name: Refresh Instagram token

# Instagram tokens last 60 days; this swaps in a fresh one every Monday.
on:
  schedule:
    - cron: "41 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Refresh and store
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          if [ -z "$IG_ACCESS_TOKEN" ]; then echo "No Instagram token yet"; exit 0; fi
          if [ -z "$GH_TOKEN" ]; then echo "::error::Add the GH_PAT secret (see README)"; exit 1; fi
          python -m sginsta refresh-token --out build/t.txt
          gh secret set IG_ACCESS_TOKEN --repo "${{ github.repository }}" < build/t.txt
          rm -f build/t.txt
